<!DOCTYPE html>
<html>

<head>

    <title>Crear Artículo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="card-login mx-auto" style="max-width:600px;">

        <h1 class="titulo text-center mb-4">
            Publicar <span class="dorado">Artículo</span>
        </h1>

        <form action="/crear_articulo" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" class="form-control" name="titulo" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" name="descripcion" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="number" class="form-control" name="precio" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <input type="text" class="form-control" name="categoria" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Imagen del artículo</label>
                <input type="file" class="form-control" name="imagen" accept="image/*" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-personal">
                    Publicar artículo
                </button>
            </div>

        </form>

    </div>

</div>

</body>

</html>
